name: WebGBA quality
on:
  push:
    branches: [fix/safari-security-save-integrity]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check engine.js
          node --check ui.js
      - name: Browser-logic regression tests
        run: node --test tests/*.test.cjs
